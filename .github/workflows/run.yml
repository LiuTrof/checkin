name: run

# 定时说明
# ---------------------------------------------------------------------------
# GitHub Actions 的 cron 使用 UTC，且官方明确说明「高负载时会延迟，不保证准时」。
# 实测延迟通常在数分钟到 1 小时之间，整点（每小时 00 分）最拥堵。
# 下面这条 = UTC 16:10 = 北京时间次日 00:10，刻意避开整点。
#
# 【重要】不要保留 push 触发器：任何一次 commit/push 都会立刻跑一次签到，
# 这是「签到时间随机」的最主要原因。改由 schedule + 手动 dispatch 触发。
#
# 【Node 版本】脚本使用全局 fetch / AbortSignal.timeout，需要 Node 18+，
# 这里固定 20。若改为 18 以下会直接报 fetch is not defined。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
  schedule:
    - cron: '10 16 * * *'

# 同一时间只允许一个签到实例，避免重复签到 / 并发冲突
concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci || npm install

      # 签到前先确认协议没变。宽松模式：只打印告警，不阻断签到，
      # 避免误报导致漏签；严重变化由独立的 guard.yml 严格告警。
      # guard 会在首次运行时为当前 DOMAIN 自动建立基线（按域名分开存储）。
      - name: Protocol Guard
        run: node guard.js --soft
        continue-on-error: true
        env:
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Checkin
        run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          # 多账号：在仓库 Secrets 里按需新增 GLADOS2 / GLADOS3 / …… 即可，
          # 未配置时值为空字符串，脚本会自动跳过，不影响原有账号。
          GLADOS2: ${{ secrets.GLADOS2 }}
          GLADOS_UA2: ${{ secrets.GLADOS_UA2 }}
          GLADOS2_UA: ${{ secrets.GLADOS2_UA }}
          GLADOS3: ${{ secrets.GLADOS3 }}
          GLADOS_UA3: ${{ secrets.GLADOS_UA3 }}
          GLADOS3_UA: ${{ secrets.GLADOS3_UA }}
          # 未配置 DOMAIN 时脚本默认 glados.cloud；
          # 使用 railgun.info 等站点时在 Secrets 里加 DOMAIN=railgun.info
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
          AUTO_EXCHANGE: ${{ secrets.AUTO_EXCHANGE }}
          EXCHANGE_THRESHOLD: ${{ secrets.EXCHANGE_THRESHOLD }}

      # 把运行结果写进 Actions Summary，手机上也能直接看签到结果，不必翻日志
      - name: Summary
        if: always()
        run: |
          {
            echo '## 签到结果'
            echo ''
            echo '| 项目 | 值 |'
            echo '| --- | --- |'
            echo "| 域名 | \`${DOMAIN:-glados.cloud}\` |"
            echo "| 时间 | $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') (UTC+8) |"
            echo "| Job 状态 | ${{ job.status }} |"
            echo ''
            echo '> 详细日志见上方 Checkin 步骤。'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
